name: Cross-Platform Tauri Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.msi, .exe)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Intel (.dmg, .app)
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon (.dmg, .app)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: Linux (.deb, .AppImage)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            webkit_package=libwebkit2gtk-4.1-dev
          else
            webkit_package=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y \
            "$webkit_package" \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LiteChat ${{ github.ref_name }}"
          releaseBody: "See the assets below to download this version."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
